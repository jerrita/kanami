# 复制为 config.toml 后填写实际连接信息。系统字段均必填。
endpoint = "ws://127.0.0.1:3001"
token = "replace-with-napcat-token"
owner = 1145141919810
main_group = 1145141919810

white_groups = [1145141919810]
openai_token = "replace-with-openai-token"
openai_base = "https://api.openai.com"

# 存在应用小节即启用；禁用时删除整个小节（包括它的子表）。
# 应用一旦启用，其所有字段都必须填写。空白名单表示不响应任何群，私聊不受影响。
[builtin]

[ping]

[gscore]
endpoint = "ws://127.0.0.1:8765/ws/kanami"
bot_id = "Kanami"
enabled_groups = [1145141919810]
node_sender_id = "1145141919810"
node_sender_nickname = "Kanami"

[cat]
white_groups = [1145141919810]

[cron]
# cron 表达式包含秒，使用 UTC；target.type 可为 main_group、group 或 private。
# main_group 使用系统 main_group；group/private 必须提供 id。
[[cron.jobs]]
schedule = "0 0 0 * * 5"
content = "周五啦！"
target = { type = "main_group" }

[[cron.jobs]]
schedule = "0 0 0 * * 1"
content = "周一啦！"
target = { type = "group", id = 1145141919810 }

[[cron.jobs]]
schedule = "0 0 13 * * *"
content = "晚上好！今天记得打卡哦~"
target = { type = "private", id = 1145141919810 }

